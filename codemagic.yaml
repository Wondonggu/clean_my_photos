# Codemagic 构建配置。
#
# 为什么需要它：iOS 只能在一台装了 Xcode 的 macOS 上编译，而本机是 Ubuntu。
# 这里把「代码检查 → 编译 → 签名 → 上传 TestFlight」整条链路放到 Codemagic 的
# macOS 构建机上，本地只负责写代码和跑不依赖平台的测试。
#
# 三个工作流：
#   ios-unsigned-check —— 不需要任何 Apple 账号，推代码就能验证 iOS 26.5 配置没坏；
#   ios-unsigned-ipa   —— 产出未签名 ipa，供免费 Apple ID 用 Sideloadly/AltStore 侧载；
#   ios-release        —— 需要先配好签名，产出可直接上 TestFlight 的 ipa。
#
# 使用前请在 Codemagic 团队设置里完成两项配置（详见 README「在 Codemagic 上构建 iOS」）：
#   1. Developer Portal → App Store Connect API key，键名填到下面 integrations 里；
#   2. codemagic.yaml settings → Code signing identities 里放好 iOS 发布证书。

workflows:
  # ------------------------------------------------------------------
  # 不需要签名的编译检查：任何一次推送都能跑，用来保证 iOS 工程配置
  # （尤其是 26.5 的部署目标）没有被改坏。
  # ------------------------------------------------------------------
  ios-unsigned-check:
    name: iOS 编译检查（无需签名）
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      # 本项目只支持 iOS 26.5 及以上，不再兼容 iOS 15。
      # Xcode 26.6 内置的是 iOS 26.5 SDK，26.5 是它能设置的最高部署目标；
      # 产物装到 iOS 26.6.1 设备上没有问题。
      # 想跟随最新稳定版可以改成 `stable`。
      flutter: 3.47.2
      xcode: 26.6
      cocoapods: default
      vars:
        # 目标部署版本。改这里的同时要改 ios/Runner.xcodeproj 和
        # ios/Flutter/AppFrameworkInfo.plist，脚本末尾会做一致性检查。
        EXPECTED_IOS_TARGET: "26.5"
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: 读取依赖
        script: flutter pub get

      - name: 静态检查
        script: flutter analyze

      - name: 单元测试与界面测试
        script: flutter test

      - name: 安装 CocoaPods 依赖
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: 编译 iOS（不签名）
        script: |
          flutter build ios --release --no-codesign

      - name: 校验产物的最低系统版本
        script: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          MIN_OS=$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")
          echo "编译产物的 MinimumOSVersion = $MIN_OS"
          if [ "$MIN_OS" != "$EXPECTED_IOS_TARGET" ]; then
            echo "❌ 期望 $EXPECTED_IOS_TARGET，实际 $MIN_OS"
            echo "请检查 ios/Runner.xcodeproj/project.pbxproj 与 ios/Flutter/AppFrameworkInfo.plist"
            exit 1
          fi
          echo "✅ 部署目标正确：iOS $MIN_OS"

      - name: 校验包内没有残留的旧部署目标
        script: |
          set -e
          # 只要有一条 IPHONEOS_DEPLOYMENT_TARGET 不是 26.5 就算错：
          # 26.6/26.6.1 超出 Xcode 26.6（iOS 26.5 SDK）的支持范围，
          # 15.5 这类旧值则说明有人把兼容性改回去了。
          if grep -rn "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj \
              | grep -v "= 26.5;"; then
            echo "❌ Xcode 工程里有不是 26.5 的部署目标"
            exit 1
          fi
          echo "✅ Xcode 工程里的部署目标都是 26.5"

    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  # ------------------------------------------------------------------
  # 免费 Apple ID 侧载：只编译、不签名，把 Runner.app 打成未签名 ipa。
  #
  # 为什么需要它：没有付费 Apple Developer Program 账号时，既不能用
  # Codemagic 的自动签名（要 App Store Connect API key），也不能用
  # TestFlight。唯一的免费办法是在 Windows/macOS 上用 Sideloadly 或
  # AltStore 登录自己的 Apple ID，把这个未签名 ipa 重签后装到自己的
  # iPhone 上。注意免费签名 7 天过期，到期要重装。
  #
  # 这个工作流不配 triggering，只能在 Codemagic 里手动启动。
  # ------------------------------------------------------------------
  ios-unsigned-ipa:
    name: iOS 未签名 IPA（免费 Apple ID 侧载）
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.2
      xcode: 26.6
      cocoapods: default
      vars:
        EXPECTED_IOS_TARGET: "26.5"
    scripts:
      - name: 读取依赖
        script: flutter pub get

      - name: 安装 CocoaPods 依赖
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: 编译 iOS（不签名）
        script: flutter build ios --release --no-codesign

      - name: 校验产物的最低系统版本
        script: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          MIN_OS=$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")
          echo "编译产物的 MinimumOSVersion = $MIN_OS"
          test "$MIN_OS" = "$EXPECTED_IOS_TARGET"

      - name: 打包成未签名 ipa
        script: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          OUT="build/ios/sideload"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          # 用 ditto 而不是 cp -R：Flutter.framework 里有符号链接，
          # ditto 会原样保留，Sideloadly 重签时才不会把框架拷坏。
          ditto "$APP" "$OUT/Payload/Runner.app"
          # -y 把符号链接按链接存进去，而不是解引用成普通文件。
          (cd "$OUT" && zip -qry clean_my_photos-unsigned.ipa Payload)
          unzip -l "$OUT/clean_my_photos-unsigned.ipa" | grep -q "Payload/Runner.app/Runner"
          echo "✅ 未签名 ipa 已生成：$OUT/clean_my_photos-unsigned.ipa"

    artifacts:
      - build/ios/sideload/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ------------------------------------------------------------------
  # 正式发布：签名后打 ipa 并上传 TestFlight。
  # ------------------------------------------------------------------
  ios-release:
    name: iOS 签名构建并上传 TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # 换成 Codemagic「Team settings → Team integrations」里
      # App Store Connect API key 的名字。
      app_store_connect: clean_my_photos_asc
    environment:
      flutter: 3.47.2
      xcode: 26.6
      cocoapods: default
      # 让 Codemagic 自动安装证书和描述文件；不需要在脚本里手写 keychain 命令。
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cleanphotos.cleanMyPhotos
      vars:
        BUNDLE_ID: com.cleanphotos.cleanMyPhotos
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner
        # App Store Connect 里该 App 的 Apple ID（数字），用于取构建号。
        # 首次发布前需要先在 App Store Connect 里手动创建 App 记录。
        APP_STORE_APP_ID: 0
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: 读取依赖
        script: flutter pub get

      - name: 静态检查
        script: flutter analyze

      - name: 单元测试与界面测试
        script: flutter test

      - name: 安装 CocoaPods 依赖
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: 配置 Xcode 工程使用签名文件
        script: |
          xcode-project use-profiles

      - name: 生成递增的构建号
        script: |
          set -e
          if [ "$APP_STORE_APP_ID" != "0" ]; then
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
            BUILD_NUMBER=$((LATEST + 1))
          else
            # 还没在 App Store Connect 里建过 App 记录时，退化成用流水号，
            # 保证同一个版本号下每次构建的 build number 都不重复。
            BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          fi
          echo "本次构建号：$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: 打包 ipa
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: 校验 ipa 的最低系统版本
        script: |
          set -e
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          MIN_OS=$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")
          echo "ipa 的 MinimumOSVersion = $MIN_OS"
          test "$MIN_OS" = "26.5"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # 用 integrations 里配置的 API key，不在这里写明文密钥。
        auth: integration
        # 先只上 TestFlight，确认没问题后再手动提交审核。
        submit_to_testflight: true
        submit_to_app_store: false

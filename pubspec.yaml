name: clean_my_photos
description: "相册清理 — 一个帮助你快速找出重复、相似、模糊、截图和超大文件并一键清理的相册管理 App。"
publish_to: 'none'

# version 的格式为 <major>.<minor>.<patch>+<build>。
# iOS: CFBundleShortVersionString=0.3.0 / CFBundleVersion=3
# Android: versionName=0.3.0 / versionCode=3
version: 0.3.0+3

# Flutter 3.47.2 自带 Dart 3.13.2。下界取 3.11.0 而不是 3.13：那正是 Flutter
# 框架自己的 `packages/flutter/pubspec.yaml` 写的 `sdk: ^3.11.0-0`，跟着它走
# 就永远不会比框架允许的更严。本地和 Codemagic 都用 3.47.2，写在这里是为了
# 哪天又在一台装了老 SDK 的机器上编出一堆看不懂的错误时能一眼看出原因。
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 中文本地化（Cupertino/Material 内置文案）
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # 访问系统相册（iOS: PHPhotoLibrary, Android: MediaStore）
  photo_manager: ^3.6.0

  # 状态管理
  provider: ^6.1.2

  # 本地轻量持久化（清理偏好、上次清理时间等）
  shared_preferences: ^2.2.2

  # 纯 Dart 图像解码，用于计算感知哈希与模糊度（在 isolate 中运行）
  image: ^4.5.0

  # 扫描缓存的落盘位置（iOS 上是 App 沙盒的 Documents 目录）
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
